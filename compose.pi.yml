# Nachschlag auf dem Pi, Port 8711. Vorne Caddy mit dem Zertifikat der Hausstelle (tools/ausrollen.sh stellt es aus),
# dahinter die App ohne TLS, nur im eigenen Netz erreichbar. Daten in ./daten.
services:
  nachschlag:
    build: .
    image: nachschlag:aktuell
    container_name: nachschlag
    restart: unless-stopped
    user: "1000:1000"
    expose:
      - "8000"
    # Einstellungen, die nicht ins Repo gehören (etwa Adresse und Schlüssel der Leitstelle), stehen nur auf dem Pi
    env_file:
      - path: .env
        required: false
    environment:
      NACHSCHLAG_DATEN: /app/daten
      NACHSCHLAG_CA_DATEI: /zertifikate/rootCA.pem
      # erste Einrichtung von anderswo (Lehre 34): der Code liegt im eingebundenen Datenordner, gefunden auf dem Pi
      NACHSCHLAG_EINRICHTUNGSCODE_DATEI: /app/daten/einrichtungscode
      # wo der Code für den Menschen zu finden ist; das Ausrollen setzt rechner:ordner aus der privaten Wahrheit
      NACHSCHLAG_EINRICHTUNGSCODE_ORT: ${EINRICHTUNGSCODE_ORT:-daten/einrichtungscode im Ordner der App}
    volumes:
      - ./daten:/app/daten
      # Sicherungen der Datenbank nach der Regel des Appkerns: wöchentlich von der App, vor dem Neustart vom Ausrollen
      - ./sicherungen:/app/sicherungen
      - ./zertifikate:/zertifikate:ro
      # die Bücher (ZIM-Dateien). Welcher Ordner, steht in der .env (BUECHER_ORDNER). Gelesen wird überall; schreiben darf
      # allein der Bücherlader (WIKI-57: .laden/ und .neu/ darin, Umschalten, Rückfall nach der Frist entfernen,
      # library.xml für den Bücherserver), darum beschreibbar
      - ${BUECHER_ORDNER:-./buecher}:/buecher
      # eigene Indizes der Bücher (WIKI-17): der Index-Dienst auf dem Mac lädt sie hoch, Nachschlag tauscht sie aus;
      # selbst erzeugt und darum in der Sicherung, anders als die Bücher
      - ./eigenindex:/eigenindex
      # große Bilder des Bildholers (WIKI-80): Nachschlag liest nur
      - ./bilder:/bilder:ro
      # Ortszeit des Pi (sonst UTC)
      - /etc/localtime:/etc/localtime:ro

  # Bildholer (WIKI-80): eigenes Programm im eigenen Container, aus demselben Abbild. Holt große Bilder aus der Bildquelle
  # der Wikis in ./bilder; Nachschlag spricht mit ihm nur im eigenen Netz der Container (kein Port nach außen) und
  # schickt ihm seine Regeln aus den Einstellungen. Warteschlange und Zähler in ./bildholer.
  bildholer:
    image: nachschlag:aktuell
    container_name: nachschlag-bildholer
    restart: unless-stopped
    user: "1000:1000"
    depends_on: [nachschlag]
    pull_policy: never                   # das Abbild baut der Dienst nachschlag; nie aus einem Verzeichnis holen
    command: ["python", "-m", "bildholer"]
    expose:
      - "8000"
    environment:
      BILDHOLER_DATEN: /daten
      BILDHOLER_ABLAGE: /bilder
    volumes:
      - ./bildholer:/daten
      - ./bilder:/bilder
      - /etc/localtime:/etc/localtime:ro

  vorne:
    image: caddy:2.11.7-alpine
    container_name: nachschlag-vorne
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [nachschlag]
    ports:
      - "8711:8711"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./zertifikate:/zertifikate:ro
